name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ----- Backend -----
      - name: Backend restore
        run: dotnet restore

      - name: Backend build
        run: dotnet build --configuration Release --no-restore

      - name: Backend unit tests
        run: dotnet test tests/TicketSystem.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --results-directory ./test-results

      - name: Backend architecture tests
        run: dotnet test tests/TicketSystem.ArchitectureTests --no-build --configuration Release --logger "trx;LogFileName=arch.trx" --results-directory ./test-results

      - name: Pre-pull SQL Server image (for Testcontainers)
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Backend integration tests
        run: dotnet test tests/TicketSystem.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration.trx" --results-directory ./test-results

      # ----- Frontend -----
      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend build
        working-directory: web
        run: npm run build -- --configuration production

      - name: Frontend unit tests
        working-directory: web
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      # ----- Docker validation -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/TicketSystem.Api/Dockerfile
          push: false
          tags: ticket-system-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: false
          tags: ticket-system-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**/*.trx
            web/coverage/**
